<!doctype html>
<html lang="zh-CN">

  <title>StoryWords · 在故事里，认识新单词</title>
  <style>
:root {
  color-scheme: light;
  --ink: #203a35;
  --muted: #53665e;
  --page: #f6f5ee;
  --paper: #fffef9;
  --line: #c8cfc3;
  --accent: #285448;
  --soft: #e7eddf;
  --warning: #76371c;
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--page);
  accent-color: var(--accent);
  scrollbar-color: var(--muted) var(--page);
}

* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button, summary, label { -webkit-tap-highlight-color: transparent; }
button, summary { cursor: pointer; }
button { min-height: 44px; border-radius: 8px; padding: 0.75rem 1.1rem; font-weight: 600; line-height: 1.5; }
button:disabled { cursor: not-allowed; opacity: 0.6; }
button:not(:disabled) { transition: background-color 150ms ease-out; }
a { color: var(--accent); text-underline-offset: 0.25em; }
:focus-visible { outline: 3px solid #93610e; outline-offset: 4px; }
::selection { background: #d9e6ce; color: var(--ink); }
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-size: 1.15rem; line-height: 1.5; }
p { line-height: 1.8; overflow-wrap: anywhere; }
fieldset { min-width: 0; border: 0; padding: 0; margin: 0; }
legend { font-weight: 600; line-height: 1.65; padding: 0; margin-bottom: 1rem; }
small { font-size: 0.875rem; line-height: 1.7; }
summary { min-height: 44px; padding-block: 0.65rem; line-height: 1.7; }
summary:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 0.25em; }
input[type="radio"] { flex: 0 0 auto; width: 1.15rem; height: 1.15rem; margin: 0.2rem 0 0; }

.app-shell { max-width: 1160px; margin: 0 auto; padding: 0 1.25rem; }
.skip-link { position: absolute; left: 1rem; top: -5rem; background: var(--paper); padding: 1rem; z-index: 2; }
.skip-link:focus { top: 1rem; }
.site-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; min-height: 90px; border-bottom: 1px solid var(--line); padding-block: 1rem; }
.wordmark { font: bold 1.8rem Georgia, "Times New Roman", serif; letter-spacing: -0.03em; }
.wordmark span { color: #9b642c; }
.profile-label { font-size: 0.8rem; color: var(--muted); }
.profile-label span { padding-inline: 0.35rem; }
main { padding: 2.5rem 0 3.5rem; min-height: 65vh; }
.page-heading { max-width: 43rem; margin-bottom: 2.5rem; }
.page-heading h1 { font: 500 clamp(2rem, 5.5vw, 3.4rem)/1.35 "Songti SC", "SimSun", Georgia, serif; letter-spacing: -0.02em; }
.page-heading p { color: var(--muted); margin-top: 1.1rem; max-width: 36rem; }
.page-heading.compact h1 { font-size: clamp(1.65rem, 4.4vw, 2.3rem); }
.page-heading.compact p { margin-top: 0.65rem; }
.start-layout { display: grid; gap: 2.25rem; }
.learning-steps { padding-left: 1.45rem; margin: 0; display: grid; gap: 1.5rem; align-content: start; }
.learning-steps li { padding-left: 0.65rem; line-height: 1.7; }
.learning-steps li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }
.learning-steps strong, .learning-steps span { display: block; }
.learning-steps span { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
.start-form { padding: 1.5rem; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.choice-row { display: flex; gap: 0.85rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; cursor: pointer; line-height: 1.6; }
.choice-row:hover { background: #f1f3e9; }
.choice-row:has(input:checked) { border-color: var(--accent); background: var(--soft); }
.choice-row:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice-row strong, .choice-row small { display: block; }
.choice-row small { color: var(--muted); margin-top: 0.3rem; }
.small-note { font-size: 0.85rem; color: var(--muted); margin: 0.7rem 0 1.25rem; }
.primary { background: var(--accent); border: 1px solid var(--accent); color: #fffef9; }
.primary:hover:not(:disabled) { background: #193e34; }
.secondary { border: 1px solid var(--accent); color: var(--accent); background: var(--paper); }
.secondary:hover:not(:disabled) { background: var(--soft); }
.text-button { border: 0; background: transparent; color: var(--accent); padding-inline: 0.25rem; text-decoration: underline; text-underline-offset: 0.25em; font-size: 0.875rem; }
.text-button:hover { color: #132b24; }
.wide { width: 100%; }
.notice { padding: 1.15rem 1.25rem; margin-bottom: 1.5rem; border-radius: 10px; background: var(--soft); line-height: 1.8; overflow-wrap: anywhere; }
.notice h2 { margin-bottom: 0.5rem; }
.notice button { margin-top: 0.8rem; margin-right: 0.65rem; }
.warning { background: #f8ebdc; color: var(--warning); }
.progress-section { margin-bottom: 1.75rem; }
.progress-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.65rem; }
.progress-heading h2 { font-size: 0.95rem; }
.progress-heading h2 span { display: inline-block; font-weight: 400; font-variant-numeric: tabular-nums; margin-left: 0.7rem; }
.source-label { font-size: 0.8rem; line-height: 1.5; color: var(--accent); background: var(--soft); padding: 0.35rem 0.65rem; border-radius: 4px; }
progress { appearance: none; display: block; height: 6px; width: 100%; margin-top: 1rem; border: 0; border-radius: 4px; overflow: hidden; background: #dce2d5; color: var(--accent); }
progress::-webkit-progress-bar { background: #dce2d5; }
progress::-webkit-progress-value { background: var(--accent); }
progress::-moz-progress-bar { background: var(--accent); }
.save-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.25rem 1rem; margin-top: 0.35rem; }
.save-row p { color: var(--muted); font-size: 0.8rem; }
.lesson-layout { display: grid; gap: 2.5rem; align-items: start; }
.reading-column, .practice-column { min-width: 0; }
.story-paper { background: var(--paper); padding: 1.5rem; border: 1px solid var(--line); border-radius: 14px; }
.story-paper h2 { font: 500 clamp(1.7rem, 4vw, 2.4rem)/1.2 Georgia, "Times New Roman", serif; }
.story-meta { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 0.8rem; margin: 1.2rem 0 2rem; }
.story-text { font: 400 1.2rem/1.95 Georgia, "Times New Roman", serif; max-width: 70ch; white-space: pre-wrap; overflow-wrap: anywhere; }
mark { background: #f4dda6; color: #3d3218; border-radius: 2px; padding: 0.05em 0.08em; box-decoration-break: clone; }
.word-action { background: transparent; border: 0; border-radius: 2px; padding: 0; min-height: 0; font: inherit; color: inherit; text-decoration: underline dotted; text-underline-offset: 0.18em; }
.reading-note { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 2rem; font-size: 0.8rem; color: var(--muted); }
.story-placeholder { padding: 2rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.story-placeholder h2 { margin-bottom: 0.75rem; }
.story-placeholder p { color: var(--muted); }
.word-section { padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
.word-section h2 { font-size: 0.9rem; color: var(--muted); }
.target-word { font: 400 2.3rem/1.4 Georgia, "Times New Roman", serif; margin: 0.5rem 0; }
.word-meaning { color: var(--accent); }
.word-meaning p { color: var(--ink); padding-bottom: 0.5rem; }
.quiz-form { margin-top: 1.75rem; }
.quiz-form h2 { margin-bottom: 1rem; }
.quiz-form legend { font-size: 0.9rem; font-weight: 400; }
.quiz-choice { padding: 0.85rem; }
.quiz-form .primary { margin-top: 0.35rem; }
.answer-feedback { color: var(--warning); background: #f8ebdc; padding: 0.8rem; border-radius: 8px; margin-block: 0.75rem; font-size: 0.9rem; }
.chapter-result h2 { font-size: 1.4rem; }
.chapter-result p { margin: 0.85rem 0 1.5rem; color: var(--muted); }
.learned-words { border-top: 1px solid var(--line); margin-top: 1.75rem; padding-top: 0.6rem; }
.learned-words dl { margin: 0.5rem 0 0; }
.learned-words dl > div { padding: 0.65rem 0; border-bottom: 1px solid var(--line); }
.learned-words dt { font-weight: 600; }
.learned-words dd { margin: 0.2rem 0 0; font-size: 0.875rem; color: var(--muted); line-height: 1.7; }
.loading-message { display: flex; gap: 0.75rem; align-items: center; padding: 1rem 0; margin-bottom: 1rem; color: var(--accent); }
.loading-dot { flex: 0 0 auto; width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--accent); animation: waiting 1.4s ease-in-out infinite alternate; }
.site-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; padding: 1.5rem 0 2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; line-height: 1.7; }

@keyframes waiting { to { opacity: 0.3; } }
@media (min-width: 760px) {
  .app-shell { padding-inline: 2.25rem; }
  main { padding-top: 3.5rem; }
  .start-layout { grid-template-columns: 1fr 1.2fr; gap: 4rem; align-items: center; }
  .lesson-layout { grid-template-columns: minmax(0, 1.8fr) minmax(260px, 1fr); }
  .story-paper { padding: 2.25rem; }
  .practice-column { padding-top: 0.35rem; }
}
@media (prefers-reduced-motion: reduce) {
  .loading-dot { animation: none; }
  button:not(:disabled) { transition: none; }
}
@media (forced-colors: active) {
  .primary, .secondary, .choice-row { border: 1px solid ButtonText; }
  progress { appearance: auto; }
  mark { outline: 1px solid CanvasText; }
}

  [hidden] { display: none !important; }
  .intro-actions { margin-top: 1.75rem; }
  .intro-actions p { margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
  .start-layout .page-heading { margin-bottom: 0; }
  .start-layout .story-paper { border-radius: 2px 14px 14px 2px; }
  .preview-title { margin-bottom: 1rem; }
  .preview-excerpt { font: 1.2rem/1.95 Georgia, "Times New Roman", serif; }
  .chapter-list { display: flex; gap: 6px; margin-top: 1rem; }
  .chapter-dot { width: 100%; height: 5px; background: var(--line); }
  .chapter-dot.done { background: var(--accent); }
  .chapter-dot.current { background: #9b642c; }
  .success-feedback { background: var(--soft); color: var(--accent); }
  .preview-caption { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
  .steps-area { border-top: 1px solid var(--line); padding-top: 2rem; margin-top: 3rem; }
  .steps-area .learning-steps { gap: 1.25rem; }
  .completed-heading { margin-bottom: 1.5rem; }
  .completed-heading h1 { font: 500 clamp(1.8rem, 4.8vw, 2.8rem)/1.4 "Songti SC", "SimSun", Georgia, serif; }
  .completed-heading p { margin-top: 0.6rem; color: var(--muted); }
  .history-item { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .history-item .story-text { padding: 0.5rem 0 1.5rem; font-size: 1.05rem; }
  @media (min-width: 760px) { .steps-area .learning-steps { grid-template-columns: repeat(3, 1fr); gap: 2.5rem; } }
  </style>
</head>

  {
    title: "The Small Silver Thing",
    text: `Grandfather looked at the silver thing in Mia's hand. "It is a locket," he said. "You can wear it and keep a photo inside." Mia opened it carefully. On one side was a photo of Grandmother. On the other side was Grandfather as a young man. Below the locket was a little note. Leo read it: "Bring the box to me in the garden. Now you know what is inside. But do you know why it is special?" Mia looked from the old photo to Grandfather. They went out together to find Grandmother.`,
  },
  {
    title: "Grandmother's Treasure",
    text: `Grandmother waited in the garden. Mia gave her the silver box and the locket. "This is my treasure," Grandmother said. "Grandfather gave it to me when we were young. We keep our story close in this little thing." Leo smiled. "So you made the map and the star clue?" "Yes, and Grandfather moved the desk for me. His wet shoe and his tall shadow were a surprise!" Everyone smiled. Now they knew who had made the strange voice and the wet marks. Mia closed the box. They had found something more special than money: a story about their family.`,
  },
];

const STORAGE_KEY = "storywords.progress.v1";
const MAX_STORY_LENGTH = 5000;
const MAX_TITLE_LENGTH = 100;
const MAX_REQUEST_BYTES = 32768;

function record(value         )                          {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("Expected an object");
  return value                           ;
}

function text(value         , max        )         {
  if (typeof value !== "string" || !value.trim() || value.length > max) throw new Error("Invalid text length");
  return value;
}

function parseMode(value         )                {
  if (value !== "ai" && value !== "demo") throw new Error("Invalid content source");
  return value;
}

function parseProfile(value         )          {
  const profile = record(value);
  if (profile.level !== "A2" || profile.genre !== "mystery") throw new Error("Only A2 mystery is supported");
  return { level: "A2", genre: "mystery" };
}

function parseLearnedIds(value         )           {
  if (!Array.isArray(value) || value.length > TARGET_WORDS.length || value.some((id, index) => id !== TARGET_WORDS[index].id)) {
    throw new Error("Completed words must be an ordered prefix of the vocabulary");
  }
  return [...value];
}

function parseStory(value         )        {
  const story = record(value);
  return { title: text(story.title, MAX_TITLE_LENGTH), text: text(story.text, MAX_STORY_LENGTH) };
}

function tokens(value        )           {
  return (value.toLowerCase().replaceAll("’", "'").match(/[a-z]+(?:'[a-z]+)*/g) ?? [])
    .map((word) => word.endsWith("'s") && !BASE_KNOWN_WORDS.includes(word) ? word.slice(0, -2) : word);
}

function createInitialState(mode                = "demo")                {
  return { version: 1, profile: { level: "A2", genre: "mystery" }, mode: parseMode(mode), learnedWordIds: [], episodes: [], currentLesson: null };
}

function getNextWord(learnedWordIds                   )                         {
  return TARGET_WORDS[parseLearnedIds(learnedWordIds).length] ?? null;
}

function getKnownWords(learnedWordIds                   )           {
  const ids = parseLearnedIds(learnedWordIds);
  return [...new Set([...BASE_KNOWN_WORDS, ...TARGET_WORDS.slice(0, ids.length).map((word) => word.text)])];
}

function checkStoryVocabulary(story       , learnedWordIds                   )                                                     {
  const next = getNextWord(learnedWordIds);
  if (!next) throw new Error("All words have been completed");
  const allowed = new Set([...getKnownWords(learnedWordIds), next.text]);
  return {
    missingTarget: !tokens(story.text).includes(next.text),
    unknownWords: [...new Set(tokens(`${story.title} ${story.text}`).filter((word) => !allowed.has(word)))],
  };
}

function assertStoryVocabulary(story       , learnedWordIds                   )       {
  const check = checkStoryVocabulary(story, learnedWordIds);
  if (check.missingTarget || check.unknownWords.length) throw new Error("Story violates the allowed vocabulary");
}

function parseEpisode(value         , previousIds                   , mode               )          {
  const episode = record(value);
  const word = getNextWord(previousIds);
  if (!word || episode.wordId !== word.id || episode.source !== mode) throw new Error("Episode does not match progress");
  const story = parseStory(episode);
  assertStoryVocabulary(story, previousIds);
  return { lessonId: text(episode.lessonId, 100), wordId: word.id, source: mode, ...story };
}

function parseLessonRequest(value         )                {
  const request = record(value);
  const profile = parseProfile(request.profile);
  const mode = parseMode(request.mode);
  const learnedWordIds = parseLearnedIds(request.learnedWordIds);
  let previousEpisode                 = null;
  if (learnedWordIds.length) {
    previousEpisode = parseEpisode(request.previousEpisode, learnedWordIds.slice(0, -1), mode);
  } else if (request.previousEpisode !== null) {
    throw new Error("The first lesson cannot have a previous episode");
  }
  return { profile, mode, learnedWordIds, previousEpisode };
}

function parseLessonResponse(value         , learnedWordIds                   , mode               )                 {
  const response = record(value);
  const expected = getNextWord(learnedWordIds);
  parseMode(mode);
  if (response.status === "completed" && !expected) return { status: "completed" };
  if (response.status !== "ready" || !expected || response.source !== mode) throw new Error("Unexpected lesson response");
  const word = record(response.word);
  if (word.id !== expected.id || word.text !== expected.text || word.meaningZh !== expected.meaningZh) throw new Error("Unexpected target word");
  const quiz = record(response.quiz);
  if (quiz.question !== expected.quiz.question || quiz.correctOptionId !== expected.quiz.correctOptionId || !Array.isArray(quiz.options) || quiz.options.length !== expected.quiz.options.length) {
    throw new Error("Unexpected quiz");
  }
  for (const [index, option] of quiz.options.entries()) {
    const parsed = record(option);
    if (parsed.id !== expected.quiz.options[index].id || parsed.text !== expected.quiz.options[index].text) throw new Error("Unexpected quiz option");
  }
  const story = parseStory(response.story);
  assertStoryVocabulary(story, learnedWordIds);
  return {
    status: "ready", lessonId: text(response.lessonId, 100), source: mode,
    word: { id: expected.id, text: expected.text, meaningZh: expected.meaningZh },
    story, quiz: structuredClone(expected.quiz),
  };
}

function parseLearningState(value         )                {
  const state = record(value);
  if (state.version !== 1) throw new Error("Unsupported save version");
  const profile = parseProfile(state.profile);
  const mode = parseMode(state.mode);
  const learnedWordIds = parseLearnedIds(state.learnedWordIds);
  if (!Array.isArray(state.episodes) || state.episodes.length !== learnedWordIds.length) throw new Error("Missing completed story history");
  const episodes = state.episodes.map((episode, index) => parseEpisode(episode, learnedWordIds.slice(0, index), mode));
  if (new Set(episodes.map((episode) => episode.lessonId)).size !== episodes.length) throw new Error("Duplicate completed episode");
  let currentLesson                     = null;
  if (state.currentLesson !== null) {
    const lesson = parseLessonResponse(state.currentLesson, learnedWordIds, mode);
    if (lesson.status !== "ready" || episodes.some((episode) => episode.lessonId === lesson.lessonId)) throw new Error("Invalid active lesson");
    currentLesson = lesson;
  }
  return { version: 1, profile, mode, learnedWordIds, episodes, currentLesson };
}

function buildLessonRequest(state               )                {
  const parsed = parseLearningState(state);
  if (parsed.currentLesson) throw new Error("Finish the current lesson before requesting another");
  return {
    profile: parsed.profile, mode: parsed.mode, learnedWordIds: parsed.learnedWordIds,
    previousEpisode: parsed.episodes.at(-1) ?? null,
  };
}

function acceptLesson(state               , value         )                {
  const parsed = parseLearningState(state);
  if (parsed.currentLesson) throw new Error("A lesson is already active");
  const lesson = parseLessonResponse(value, parsed.learnedWordIds, parsed.mode);
  if (lesson.status !== "ready" || parsed.episodes.some((episode) => episode.lessonId === lesson.lessonId)) throw new Error("No new lesson to accept");
  return { ...parsed, currentLesson: lesson };
}

function submitAnswer(state               , optionId        )               {
  const parsed = parseLearningState(state);
  const lesson = parsed.currentLesson;
  if (!lesson) return { status: "no-active-lesson", state: parsed };
  if (!lesson.quiz.options.some((option) => option.id === optionId)) throw new Error("Unknown quiz option");
  if (optionId !== lesson.quiz.correctOptionId) return { status: "incorrect", state: parsed };
  return {
    status: "correct",
    state: {
      ...parsed,
      learnedWordIds: [...parsed.learnedWordIds, lesson.word.id],
      episodes: [...parsed.episodes, { lessonId: lesson.lessonId, wordId: lesson.word.id, source: lesson.source, ...lesson.story }],
      currentLesson: null,
    },
  };
}

function loadProgress(storage                           )                 {
  let raw               ;
  try {
    raw = (storage ?? window.localStorage).getItem(STORAGE_KEY);
  } catch {
    return { status: "unavailable" };
  }
  if (raw === null) return { status: "empty" };
  try {
    return { status: "ready", state: parseLearningState(JSON.parse(raw)) };
  } catch {
    return { status: "invalid" };
  }
}

function saveProgress(state               , storage                           )          {
  try {
    const parsed = parseLearningState(state);
    (storage ?? window.localStorage).setItem(STORAGE_KEY, JSON.stringify(parsed));
    return true;
  } catch {
    return false;
  }
}

// The caller must obtain confirmation before clearing an existing or invalid save.
function clearProgress(storage                              )          {
  try {
    (storage ?? window.localStorage).removeItem(STORAGE_KEY);
    return true;
  } catch {
    return false;
  }
}

const screen = document.getElementById('screen');
const notice = document.getElementById('notice');
let state = null;
let storedStatus = 'empty';
let saved = true;
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
const button = (id, label, kind = 'primary') => `<button type="button" id="${id}" class="${kind}">${label}</button>`;
function warn(message) {
  notice.hidden = !message;
  notice.className = 'notice warning';
  notice.textContent = message;
}
function restore() {
  const stored = loadProgress();
  storedStatus = stored.status;
  state = stored.status === 'ready' ? stored.state : null;
  saved = true;
  warn('');
  render();
}
function keep(next) {
  state = next;
  storedStatus = 'ready';
  saved = saveProgress(state);
  warn(saved ? '' : '本次进度尚未保存。请保持页面打开，允许浏览器保存本地数据后，点击“重试保存”。');
  render();
}
function focus(id) { document.getElementById(id)?.focus(); }
function openChapter() {
  if (state?.currentLesson || (state && !getNextWord(state.learnedWordIds))) return;
  const current = state ?? createInitialState('demo');
  const index = current.learnedWordIds.length;
  const word = getNextWord(current.learnedWordIds);
  keep(acceptLesson(current, {
    status: 'ready', lessonId: `demo-v1-${String(index + 1).padStart(2, '0')}`,
    source: 'demo', word, story: DEMO_LESSONS[index], quiz: word.quiz,
  }));
  focus('story-title');
}
function reset() {
  if (!confirm('确定重新开始吗？这会清除当前浏览器中本文件的 StoryWords 学习进度。')) return;
  if (!clearProgress()) { warn('无法清除本地进度。请检查浏览器的本地存储权限后重试。'); return; }
  restore();
  focus('start');
}
function storyMarkup(story, word) {
  return escapeHtml(story.text).replace(new RegExp(`\\b${word.text}\\b`, 'gi'), match =>
    `<button class="word-action" type="button" data-meaning aria-label="查看 ${word.text} 的中文释义"><mark>${match}</mark></button>`);
}
function render() {
  if (storedStatus === 'invalid' || (state && state.mode !== 'demo')) {
    screen.innerHTML = `<section class="page-heading"><h1>已有进度已保留。</h1><p>${storedStatus === 'invalid' ? '本地存档无法读取，尚未覆盖。你可以重试读取，或确认后重新开始。' : '检测到真实 AI 模式的存档。此 HTML 只提供离线预置故事，请回到原应用继续，或确认清除后开启演示。'}</p></section>${button('retry-read', '重试读取', 'secondary')} ${button('reset', '清除进度并重新开始', 'text-button')}`;
    bind(); return;
  }
  if (storedStatus === 'unavailable') {
    screen.innerHTML = `<section class="page-heading"><h1>暂时无法读取学习进度。</h1><p>请允许浏览器访问本地存储，或在 Edge、Chrome 的普通窗口中打开本文件，再重试。</p></section>${button('retry-read', '重试读取')}`;
    bind(); return;
  }
  if (!state) {
    screen.innerHTML = `<div class="start-layout">
      <section class="page-heading"><h1>把一个生词，<br>读成一段故事。</h1><p>跟随 Mia 和 Leo，走进祖母的老房子。每一章认识一个新词，答对一道题，再揭开下一条线索。</p>
      <div class="intro-actions">${button('start', '开始第一章')}<p>10 章连续故事 · 每章 1 个新词 · 随时暂停，回来继续</p></div></section>
      <article class="story-paper"><h2 class="preview-title" lang="en">The Light in the Old House</h2><p class="preview-excerpt" lang="en">Mia and Leo stood outside their grandmother's old house. She wanted them to find a small silver box. “Start where the light is,” she said.</p><p class="preview-caption">祖母留下了一句话。那只银色盒子，究竟藏在哪里？</p></article>
      </div><section class="steps-area" aria-label="学习方式"><ol class="learning-steps"><li><strong>读一小段故事</strong><span>用熟悉的词，理解新的线索。</span></li><li><strong>认识一个新词</strong><span>点击正文中高亮的单词，查看释义。</span></li><li><strong>答对，继续追下去</strong><span>新词加入已学词，解锁下一章。</span></li></ol></section>`;
    bind(); return;
  }
  const count = state.learnedWordIds.length;
  const lesson = state.currentLesson;
  const episode = state.episodes.at(-1);
  const story = lesson?.story ?? episode;
  const word = lesson?.word ?? TARGET_WORDS.find(item => item.id === episode?.wordId);
  const finished = count === TARGET_WORDS.length;
  screen.innerHTML = `<section class="progress-section" aria-label="学习进度"><div class="progress-heading"><h2>你的故事进度 <span>已完成 <b id="completed-count">${count}</b> / 10</span></h2><span class="profile-label">${finished ? '故事已完结' : `第 ${lesson ? count + 1 : Math.max(count, 1)} 章`}</span></div>
    <progress value="${count}" max="10" aria-label="已完成单词数">${count}/10</progress>
    <div class="save-row"><p role="status">${saved ? '进度已保存在当前浏览器' : '本次进度尚未保存'}</p><div>${saved ? '' : button('retry-save', '重试保存', 'text-button')} ${button('reset', '重新开始', 'text-button')}</div></div></section>
    ${finished ? '<section class="completed-heading"><h1>这段故事，你读完了。</h1><p>十个新词，一场关于家人的寻宝。你找到了故事的结局，也带走了新的词汇。</p></section>' : ''}
    <div class="lesson-layout"><div class="reading-column">${story ? `<article class="story-paper"><h2 id="story-title" tabindex="-1" lang="en">${escapeHtml(story.title)}</h2><div class="story-meta"><span>第 ${lesson ? count + 1 : count} 章 / 共 10 章</span><span>预置故事</span></div><p class="story-text" lang="en">${storyMarkup(story, word)}</p><p class="reading-note">点击高亮单词查看释义。先读懂故事，再试着回答右侧或下方的问题。</p></article>` : '<p class="story-placeholder">准备好继续故事了吗？</p>'}</div>
    <aside class="practice-column" aria-label="单词与练习">${word ? `<section class="word-section"><h2>${lesson ? '本章新词' : '刚刚学会'}</h2><p class="target-word" lang="en">${escapeHtml(word.text)}</p><details class="word-meaning" id="meaning"><summary>查看中文释义</summary><p>${escapeHtml(word.meaningZh)}</p></details></section>` : ''}
    ${lesson ? `<form id="quiz" class="quiz-form"><h2>把这个词记住了吗？</h2><fieldset><legend>${escapeHtml(lesson.quiz.question)}</legend>${lesson.quiz.options.map(option => `<label class="choice-row quiz-choice"><input type="radio" name="answer" value="${option.id}" required><span>${escapeHtml(option.text)}</span></label>`).join('')}</fieldset><p id="feedback" class="answer-feedback" role="status" hidden></p><button id="submit" class="primary wide" type="submit" disabled>提交答案</button></form>` : `<section class="chapter-result" style="margin-top:1.5rem"><h2 id="chapter-result" tabindex="-1">${finished ? '10 个新词，全部解锁。' : count ? '答对了，下一条线索在等你。' : '故事准备好了。'}</h2><p>${finished ? '可以回看下面的完整故事，也可以重新开始一轮。' : '已学会的单词会成为熟词，陪你继续读下去。'}</p>${finished ? '' : button('next', count ? '继续下一章' : '开始第一章')}</section>`}
    <details class="learned-words" ${finished ? 'open' : ''}><summary>已学单词（${count} / 10）</summary>${count ? `<dl>${TARGET_WORDS.slice(0, count).map(item => `<div><dt lang="en">${escapeHtml(item.text)}</dt><dd>${escapeHtml(item.meaningZh)}</dd></div>`).join('')}</dl>` : '<p class="small-note">答对本章问题后，第一个单词就会出现在这里。</p>'}</details></aside></div>
    ${finished ? `<section class="steps-area"><h2>再读一次，线索都连起来了。</h2>${state.episodes.map((item, index) => `<details class="history-item"><summary>第 ${index + 1} 章 · <span lang="en">${escapeHtml(item.title)}</span></summary><p class="story-text" lang="en">${escapeHtml(item.text)}</p></details>`).join('')}</section>` : ''}`;
  bind();
}
function bind() {
  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
  on('start', openChapter); on('next', openChapter); on('reset', reset); on('retry-read', restore);
  on('retry-save', () => { keep(state); focus('story-title'); });
  screen.querySelectorAll('[data-meaning]').forEach(element => element.addEventListener('click', () => {
    const details = document.getElementById('meaning'); details.open = true; details.querySelector('summary').focus();
  }));
  const quiz = document.getElementById('quiz');
  quiz?.addEventListener('change', () => { document.getElementById('submit').disabled = false; document.getElementById('feedback').hidden = true; });
  quiz?.addEventListener('submit', event => {
    event.preventDefault();
    const selected = new FormData(quiz).get('answer');
    if (!selected || !state.currentLesson) return;
    const result = submitAnswer(state, selected);
    if (result.status === 'incorrect') {
      const feedback = document.getElementById('feedback'); feedback.hidden = false; feedback.textContent = '还差一点。再读读这个词出现的句子，换一个答案试试。'; return;
    }
    if (result.status === 'correct') { keep(result.state); focus('chapter-result'); }
  });
}
window.addEventListener('beforeunload', event => { if (!saved) { event.preventDefault(); event.returnValue = ''; } });
restore();
})();
</script>
</body>
